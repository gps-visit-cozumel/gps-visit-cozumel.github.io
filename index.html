<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Visit Cozumel · Fleet Tracking</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg: #050505;
    --panel: #0e0e10;
    --panel-border: rgba(255,255,255,0.08);
    --text: #f5f5f7;
    --text-dim: #8a8a8e;
    --accent: #0a84ff;
    --accent-soft: rgba(10,132,255,0.14);
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app{
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    padding: 20px 20px 24px;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 4px 4px 18px;
    flex-wrap: wrap; gap: 12px;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .eyebrow{
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim); font-weight: 600;
  }
  .brand h1{ margin:0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .clock{ text-align:right; }
  .clock .time{ font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .clock .status{ font-size: 12px; margin-top: 2px; font-weight: 500; }
  .status.open{ color: #34c759; }
  .status.closed{ color: #ff6b6b; }

  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
  }
  nav.pills{
    display:flex; gap: 6px; padding: 4px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    width: fit-content; max-width: 100%;
    overflow-x: auto;
  }
  nav.pills button{
    appearance:none; border:none; cursor:pointer;
    background: transparent; color: var(--text-dim);
    font-size: 14px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px;
    white-space: nowrap;
    transition: background 0.25s ease, color 0.25s ease;
    font-family: inherit;
    display:flex; align-items:center; gap:7px;
  }
  nav.pills button .dot{
    width:7px; height:7px; border-radius:50%; flex-shrink:0;
  }
  nav.pills button.active{ background: var(--accent); color: white; }
  nav.pills button.active .dot{ background:white !important; }

  .toolbar-right{ display:flex; gap:8px; }
  .ghost-btn{
    appearance:none; cursor:pointer;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--panel-border);
    font-size: 13px; font-weight: 600;
    padding: 10px 16px; border-radius: 999px;
    font-family: inherit;
    display:flex; align-items:center; gap:6px;
    transition: background 0.2s ease;
  }
  .ghost-btn:hover{ background:#17171a; }
  .ghost-btn.on{ background: var(--accent-soft); color: var(--accent); border-color: rgba(10,132,255,0.35); }

  main{
    flex: 1; position: relative; display:flex; gap:14px; min-height:0;
  }
  .map-wrap{
    flex: 1; position: relative;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: var(--radius); overflow: hidden;
  }
  #map{ width:100%; height:100%; background:#0b0b0d; }
  .leaflet-popup-content-wrapper{
    background: #16171b; color: var(--text); border-radius: 12px;
  }
  .leaflet-popup-tip{ background: #16171b; }
  .leaflet-popup-content{ font-family: inherit; font-size: 13px; margin: 10px 12px; }
  .leaflet-popup-content b{ font-size: 14px; }
  .leaflet-control-attribution{
    background: rgba(5,5,5,0.6) !important; color: var(--text-dim) !important;
    font-size: 10px !important;
  }
  .leaflet-control-attribution a{ color: var(--text-dim) !important; }

  .veh-pin{
    width: 26px; height:26px; border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 3px solid #050505;
    box-shadow: 0 2px 6px rgba(0,0,0,0.55);
  }
  .leaflet-tooltip.veh-label{
    background: rgba(14,14,16,0.94);
    color: var(--text);
    border: 1.5px solid rgba(255,255,255,0.16);
    border-radius: 8px;
    padding: 4px 9px;
    font-size: 12.5px; font-weight: 700;
    font-family: inherit;
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
  }
  .leaflet-tooltip.veh-label::before{ display:none; }

  .side-panel{
    width: 300px; flex-shrink:0;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .side-panel.hidden{ display:none; }
  .side-panel h3{
    margin:0; padding: 16px 16px 10px;
    font-size: 14px; font-weight: 700;
    border-bottom: 1px solid var(--panel-border);
  }
  .side-panel .hint{
    padding: 10px 16px; font-size: 11.5px; color: var(--text-dim);
    line-height:1.5; border-bottom: 1px solid var(--panel-border);
  }
  .stops-list{ overflow-y:auto; flex:1; padding: 8px 10px; }
  .stop-item{
    display:flex; gap:10px; padding: 10px 8px; border-radius: 12px;
  }
  .stop-item + .stop-item{ margin-top: 2px; }
  .stop-item .rail{
    display:flex; flex-direction:column; align-items:center; padding-top:3px;
  }
  .stop-item .rail .node{
    width:8px; height:8px; border-radius:50%; background: var(--accent);
  }
  .stop-item .rail .line{
    width:2px; flex:1; background: var(--panel-border); margin-top:2px;
  }
  .stop-item .meta{ flex:1; padding-bottom: 4px; }
  .stop-item .meta .t{ font-size:12.5px; font-weight:700; }
  .stop-item .meta .a{ font-size:12px; color: var(--text-dim); margin-top:2px; line-height:1.4; }
  .empty-stops{ padding: 24px 16px; text-align:center; color: var(--text-dim); font-size:13px; line-height:1.5; }

  .lock-screen{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap: 14px;
    background: radial-gradient(circle at 50% 30%, #16171b 0%, #08080a 70%);
    text-align:center; padding: 32px; z-index: 500;
  }
  .lock-screen.hidden{ display:none; }
  .lock-icon{ width: 56px; height:56px; border-radius: 50%; background: var(--accent-soft); display:flex; align-items:center; justify-content:center; }
  .lock-icon svg{ width:24px; height:24px; }
  .lock-screen h2{ margin:0; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
  .lock-screen p{ margin:0; color: var(--text-dim); font-size: 14px; max-width: 320px; line-height:1.5; }
  .lock-screen .countdown{ margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }

  .window-note{ text-align:center; color: var(--text-dim); font-size: 12px; margin-top: 14px; }

  @media (max-width: 760px){
    main{ flex-direction: column; }
    .side-panel{ width:100%; max-height: 220px; }
  }
  @media (max-width: 520px){
    .brand h1{ font-size: 17px; }
    nav.pills button{ padding: 8px 12px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="eyebrow">Visit Cozumel</span>
      <h1>Fleet Tracking</h1>
    </div>
    <div class="clock">
      <div class="time" id="clockTime">--:--</div>
      <div class="status" id="clockStatus">—</div>
    </div>
  </header>

  <div class="toolbar">
    <nav class="pills" id="vehiclePills"></nav>
    <div class="toolbar-right">
      <button class="ghost-btn" id="stopsToggle">Stops today</button>
    </div>
  </div>

  <main>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="lock-screen hidden" id="lockScreen">
        <div class="lock-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0a84ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="10" rx="2"></rect>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
          </svg>
        </div>
        <h2>Tracking unavailable</h2>
        <p>Live location is only shared daily from 8:00 AM to 4:00 PM (Cancún time).</p>
        <div class="countdown" id="countdown"></div>
      </div>
    </div>
    <aside class="side-panel hidden" id="sidePanel">
      <h3 id="sidePanelTitle">Stops today</h3>
      <div class="hint">Builds live while this page stays open — it can't show stops from before it was opened.</div>
      <div class="stops-list" id="stopsList"></div>
    </aside>
  </main>

  <div class="window-note">Available daily · 8:00 AM – 4:00 PM · America/Cancún</div>
</div>

<script>
  const VEHICLES = [
    { key: "jeep1", name: "Jeep 1", token: "jfkgv29h8dmkbouefpt682ul02", color: "#0a84ff" },
    { key: "jeep2", name: "Jeep 2", token: "kdb1vvkoddo6fdgol94jonuhei", color: "#ff9f0a" },
    { key: "jeep3", name: "Jeep 3", token: "b7jg7c62n71ksed7l27g60tbvc", color: "#bf5af2" },
    { key: "avanza", name: "Avanza 240", token: "tbge4t53caf3h6t342td2k04t5", color: "#30d158" },
  ];
  const ALL_KEY = "all";
  const TIMEZONE = "America/Cancun";
  const OPEN_HOUR = 8;    // 8:00 AM
  const CLOSE_HOUR = 16;  // 4:00 PM
  const POLL_MS = 10 * 1000;          // how often we ask Tracki for a position
  const MOVE_THRESHOLD_M = 40;        // meters of movement before we log a new "stops today" point
  const RECENT_TRAIL_MS = 90 * 1000;  // how much of the live path tail to keep on the map
  const GEOCODE_MIN_GAP_MS = 1100;    // be polite to the free geocoder

  const pillsEl = document.getElementById("vehiclePills");
  const lockEl = document.getElementById("lockScreen");
  const countdownEl = document.getElementById("countdown");
  const clockTimeEl = document.getElementById("clockTime");
  const clockStatusEl = document.getElementById("clockStatus");
  const stopsToggle = document.getElementById("stopsToggle");
  const sidePanel = document.getElementById("sidePanel");
  const sidePanelTitle = document.getElementById("sidePanelTitle");
  const stopsList = document.getElementById("stopsList");

  let activeKey = VEHICLES[0].key;
  let isOpenCached = null;
  let sidePanelOpen = false;
  let pollTimer = null;
  let trimTimer = null;
  let geocodeQueue = Promise.resolve();
  let lastGeocodeAt = 0;

  // per-vehicle in-memory state (resets on page reload)
  const state = {};
  VEHICLES.forEach(v => {
    state[v.key] = { marker: null, trail: [], lastFix: null, recentTrail: [], recentPolyline: null };
  });

  // ---------- map setup ----------
  const map = L.map("map", { zoomControl: true, attributionControl: true }).setView([20.5, -86.95], 12);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: "abcd", maxZoom: 20
  }).addTo(map);

  function pinIcon(color) {
    return L.divIcon({
      className: "",
      html: `<div class="veh-pin" style="background:${color}"></div>`,
      iconSize: [26, 26], iconAnchor: [13, 22], popupAnchor: [0, -20]
    });
  }
  // ---------- pills ----------
  function buildPills() {
    pillsEl.innerHTML = "";
    VEHICLES.forEach(v => {
      const btn = document.createElement("button");
      btn.innerHTML = `<span class="dot" style="background:${v.color}"></span>${v.name}`;
      if (v.key === activeKey) btn.classList.add("active");
      btn.addEventListener("click", () => selectVehicle(v.key));
      pillsEl.appendChild(btn);
    });
    const allBtn = document.createElement("button");
    allBtn.innerHTML = `<span class="dot" style="background:#ffffff"></span>All vehicles`;
    if (activeKey === ALL_KEY) allBtn.classList.add("active");
    allBtn.addEventListener("click", () => selectVehicle(ALL_KEY));
    pillsEl.appendChild(allBtn);
  }

  function selectVehicle(key) {
    activeKey = key;
    [...pillsEl.children].forEach((btn, idx) => {
      const k = idx < VEHICLES.length ? VEHICLES[idx].key : ALL_KEY;
      btn.classList.toggle("active", k === key);
    });
    updateMapVisibility();
    renderStopsList();
    fitToActive();
  }

  stopsToggle.addEventListener("click", () => {
    sidePanelOpen = !sidePanelOpen;
    sidePanel.classList.toggle("hidden", !sidePanelOpen);
    stopsToggle.classList.toggle("on", sidePanelOpen);
    renderStopsList();
    setTimeout(() => map.invalidateSize(), 220);
  });

  // ---------- time / lock window ----------
  function getCancunParts() {
    const fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: TIMEZONE, hour12: false,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
    const parts = {};
    fmt.formatToParts(new Date()).forEach(p => { if (p.type !== "literal") parts[p.type] = parseInt(p.value, 10); });
    return parts;
  }
  function isWithinWindow(parts) {
    const minutesNow = parts.hour * 60 + parts.minute;
    return minutesNow >= OPEN_HOUR * 60 && minutesNow < CLOSE_HOUR * 60;
  }
  function formatClock(parts) {
    let h = parts.hour % 12; if (h === 0) h = 12;
    const suffix = parts.hour >= 12 ? "PM" : "AM";
    return `${h}:${String(parts.minute).padStart(2, "0")} ${suffix}`;
  }
  function formatTime(date) {
    return new Intl.DateTimeFormat("en-US", { timeZone: TIMEZONE, hour: "numeric", minute: "2-digit", hour12: true }).format(date);
  }
  function nextBoundaryLabel(parts, open) {
    const minutesNow = parts.hour * 60 + parts.minute;
    let targetMinutes, label;
    if (open) { targetMinutes = CLOSE_HOUR * 60; label = "Hides at 4:00 PM"; }
    else {
      targetMinutes = OPEN_HOUR * 60;
      if (minutesNow >= CLOSE_HOUR * 60) targetMinutes += 24 * 60;
      label = "Opens at 8:00 AM";
    }
    let diff = targetMinutes - minutesNow;
    if (diff < 0) diff += 24 * 60;
    const hrs = Math.floor(diff / 60), mins = diff % 60;
    return { label, remaining: hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m` };
  }

  function applyClock(force) {
    const parts = getCancunParts();
    const open = isWithinWindow(parts);
    clockTimeEl.textContent = formatClock(parts);
    clockStatusEl.textContent = open ? "Live" : "Not shared";
    clockStatusEl.className = "status " + (open ? "open" : "closed");
    const { label, remaining } = nextBoundaryLabel(parts, open);
    countdownEl.textContent = `${label} · ${remaining}`;

    if (open === isOpenCached && !force) return;
    isOpenCached = open;

    if (open) {
      lockEl.classList.add("hidden");
      startPolling();
    } else {
      lockEl.classList.remove("hidden");
      stopPolling();
    }
  }

  // ---------- distance helper ----------
  function distMeters(a, b) {
    const R = 6371000, toRad = d => d * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }

  // ---------- reverse geocoding (throttled + cached) ----------
  const geocodeCache = new Map();
  function reverseGeocode(lat, lng) {
    const key = lat.toFixed(4) + "," + lng.toFixed(4);
    if (geocodeCache.has(key)) return Promise.resolve(geocodeCache.get(key));
    geocodeQueue = geocodeQueue.then(async () => {
      const wait = Math.max(0, GEOCODE_MIN_GAP_MS - (Date.now() - lastGeocodeAt));
      if (wait) await new Promise(r => setTimeout(r, wait));
      lastGeocodeAt = Date.now();
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=16`);
        const j = await r.json();
        const label = j && j.display_name ? j.display_name.split(",").slice(0, 3).join(",") : `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        geocodeCache.set(key, label);
        return label;
      } catch (e) {
        return `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      }
    });
    return geocodeQueue;
  }

  // ---------- fetch + render a vehicle ----------
  async function refreshVehicle(v) {
    try {
      const r = await fetch(`https://plus.tracki.com/api/v3/public/devices/${v.token}`);
      if (!r.ok) throw new Error("bad status " + r.status);
      const data = await r.json();
      const d = Array.isArray(data) ? data[0] : data;
      if (!d || !d.geoLocation) return;
      const lat = d.geoLocation.latitude, lng = d.geoLocation.longitude;
      const fixTime = d.lastUpdated ? new Date(d.lastUpdated) : new Date();
      const s = state[v.key];
      const isFirstFix = !s.marker;

      if (!s.marker) {
        s.marker = L.marker([lat, lng], { icon: pinIcon(v.color) }).addTo(map);
        s.marker.bindTooltip(v.name, { permanent: true, direction: "right", offset: [16, -12], className: "veh-label", opacity: 1 });
      } else {
        s.marker.setLatLng([lat, lng]);
      }
      s.marker.bindPopup(`<b>${v.name}</b><br>As of ${formatTime(fixTime)}${d.batteryLevel != null ? " · " + d.batteryLevel + "% battery" : ""}`);
      s.lastFix = { lat, lng, time: fixTime, battery: d.batteryLevel };

      // live 90-second tail — every fix, no movement filter, so the path hugs the actual street.
      // it's a sliding window: points older than RECENT_TRAIL_MS drop off on every redraw, so the
      // line never accumulates into an all-day mess — it's always just "where it just went."
      s.recentTrail.push({ lat, lng, time: fixTime });
      redrawRecentTrail(v);

      const prev = s.trail[s.trail.length - 1];
      if (!prev || distMeters(prev, { lat, lng }) >= MOVE_THRESHOLD_M) {
        s.trail.push({ lat, lng, time: fixTime });
        // Note: intentionally NOT drawn on the map — only the live 90s tail is. This just
        // feeds the "Stops today" list below so the map itself never gets cluttered with an
        // all-day line.
        reverseGeocode(lat, lng).then(label => {
          const point = s.trail[s.trail.length - 1];
          if (point) point.label = label;
          if (activeKey === v.key || activeKey === ALL_KEY) renderStopsList();
        });
      }
      if (isFirstFix && (activeKey === v.key || activeKey === ALL_KEY)) fitToActive();
    } catch (e) {
      // silent — vehicle may be briefly offline; UI just keeps last known position
    }
  }

  function redrawRecentTrail(v) {
    const s = state[v.key];
    const cutoff = Date.now() - RECENT_TRAIL_MS;
    s.recentTrail = s.recentTrail.filter(p => p.time.getTime() >= cutoff);
    const latlngs = s.recentTrail.map(p => [p.lat, p.lng]);
    if (s.recentPolyline) map.removeLayer(s.recentPolyline);
    if (latlngs.length > 1) {
      s.recentPolyline = L.polyline(latlngs, { color: v.color, weight: 5, opacity: 0.9, lineCap: "round", lineJoin: "round" });
      const show = activeKey === ALL_KEY || activeKey === v.key;
      if (show) s.recentPolyline.addTo(map);
    } else {
      s.recentPolyline = null;
    }
  }

  function refreshAll() {
    Promise.all(VEHICLES.map(refreshVehicle)).then(() => {
      updateMapVisibility();
      if (sidePanelOpen) renderStopsList();
    });
  }
  function startPolling() {
    if (!pollTimer) {
      refreshAll();
      pollTimer = setInterval(refreshAll, POLL_MS);
    }
    if (!trimTimer) {
      // keeps the live 90s tail shrinking smoothly between polls, not just when new data arrives
      trimTimer = setInterval(() => VEHICLES.forEach(redrawRecentTrail), 5000);
    }
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (trimTimer) { clearInterval(trimTimer); trimTimer = null; }
  }

  // ---------- map visibility per selection ----------
  function updateMapVisibility() {
    VEHICLES.forEach(v => {
      const s = state[v.key];
      const show = activeKey === ALL_KEY || activeKey === v.key;
      [s.marker, s.recentPolyline].forEach(layer => {
        if (!layer) return;
        if (show && !map.hasLayer(layer)) layer.addTo(map);
        if (!show && map.hasLayer(layer)) map.removeLayer(layer);
      });
    });
  }

  function fitToActive() {
    if (activeKey === ALL_KEY) {
      const pts = VEHICLES.map(v => state[v.key].lastFix).filter(Boolean).map(f => [f.lat, f.lng]);
      if (pts.length) map.fitBounds(pts, { padding: [50, 50], maxZoom: 15 });
    } else {
      const f = state[activeKey].lastFix;
      if (f) map.setView([f.lat, f.lng], Math.max(map.getZoom(), 16));
    }
  }

  // ---------- stops side panel ----------
  function renderStopsList() {
    if (!sidePanelOpen) return;
    const keys = activeKey === ALL_KEY ? VEHICLES.map(v => v.key) : [activeKey];
    sidePanelTitle.textContent = activeKey === ALL_KEY ? "Stops today · all vehicles" : `Stops today · ${VEHICLES.find(v => v.key === activeKey).name}`;

    let rows = [];
    keys.forEach(k => {
      const v = VEHICLES.find(x => x.key === k);
      state[k].trail.forEach((p, idx) => rows.push({ v, p, isFirstForVehicle: idx === 0 }));
    });
    rows.sort((a, b) => a.p.time - b.p.time);

    if (!rows.length) {
      stopsList.innerHTML = `<div class="empty-stops">No stops recorded yet today. Points appear here as the vehicle moves while this page stays open.</div>`;
      return;
    }
    stopsList.innerHTML = rows.map((row, i) => `
      <div class="stop-item">
        <div class="rail">
          <div class="node" style="background:${row.v.color}"></div>
          ${i < rows.length - 1 ? '<div class="line"></div>' : ''}
        </div>
        <div class="meta">
          <div class="t">${activeKey === ALL_KEY ? row.v.name + " · " : ""}${row.isFirstForVehicle ? "Departed " : ""}${formatTime(row.p.time)}</div>
          <div class="a">${row.p.label || "Locating…"}</div>
        </div>
      </div>
    `).join("");
  }

  // ---------- init ----------
  buildPills();
  applyClock(true);
  setInterval(() => applyClock(false), 15000);
</script>
</body>
</html>
